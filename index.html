<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">🎓 EduTrack</div>
      <p class="tagline">Student Management Dashboard</p>
    </div>
    <div class="header-stats">
      <div class="stat-pill" id="total-count">Total: 0</div>
      <div class="stat-pill honor" id="honor-count">Honor: 0</div>
      <div class="stat-pill avg" id="avg-gpa">Avg GPA: 0.00</div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="main">

    <!-- SIDEBAR FORM -->
    <aside class="sidebar">
      <h2 class="form-title" id="form-title">Add Student</h2>

      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="e.g. Juan" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="e.g. dela Cruz" />
      </div>
      <div class="form-group">
        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="e.g. 2024-0001" />
      </div>
      <div class="form-group">
        <label>Course</label>
        <input type="text" id="course" placeholder="e.g. BSCS" />
      </div>
      <div class="form-group">
        <label>Year Level</label>
        <select id="yearLevel">
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>

      <hr class="divider"/>
      <p class="grades-label">Grades (0–100)</p>

      <div class="grades-grid">
        <div class="form-group">
          <label>Math</label>
          <input type="number" id="math" min="0" max="100" placeholder="0–100" />
        </div>
        <div class="form-group">
          <label>Science</label>
          <input type="number" id="science" min="0" max="100" placeholder="0–100" />
        </div>
        <div class="form-group">
          <label>English</label>
          <input type="number" id="english" min="0" max="100" placeholder="0–100" />
        </div>
        <div class="form-group">
          <label>Filipino</label>
          <input type="number" id="filipino" min="0" max="100" placeholder="0–100" />
        </div>
        <div class="form-group">
          <label>PE</label>
          <input type="number" id="pe" min="0" max="100" placeholder="0–100" />
        </div>
        <div class="form-group">
          <label>Elective</label>
          <input type="number" id="elective" min="0" max="100" placeholder="0–100" />
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-primary" id="submit-btn" onclick="handleSubmit()">➕ Add Student</button>
        <button class="btn-ghost" id="cancel-btn" onclick="cancelEdit()" style="display:none;">Cancel</button>
      </div>
    </aside>

    <!-- DASHBOARD CONTENT -->
    <section class="content">

      <!-- SEARCH & FILTER BAR -->
      <div class="toolbar">
        <input type="text" class="search-box" id="search-input" placeholder="🔍 Search by name, ID, or course..." oninput="handleSearch()" />
        <div class="filters">
          <select id="filter-year" onchange="handleSearch()">
            <option value="">All Years</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
          <select id="filter-status" onchange="handleSearch()">
            <option value="">All Students</option>
            <option value="honor">Honor Only</option>
            <option value="regular">Regular Only</option>
          </select>
          <select id="view-toggle" onchange="toggleView()">
            <option value="cards">Card View</option>
            <option value="table">Table View</option>
          </select>
        </div>
      </div>

      <!-- STUDENT CARDS -->
      <div id="card-view">
        <div class="student-grid" id="student-grid">
          <!-- Cards rendered by JS -->
        </div>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🎒</div>
          <p>No students found. Add one using the form!</p>
        </div>
      </div>

      <!-- STUDENT TABLE -->
      <div id="table-view" style="display:none;">
        <div class="table-wrapper">
          <table class="student-table">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year</th>
                <th>GPA</th>
                <th>Grade</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="student-table-body">
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-title">Student Details</h3>
      <div id="modal-content"></div>
      <button class="btn-primary" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script src="classes.js"></script>
  <script src="app.js"></script>
</body>
</html>
